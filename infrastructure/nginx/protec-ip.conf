map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=30s ipv6=off;

# Avoid writing SignalR access_token query parameters into request logs.
log_format protec '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log protec;

server {
    listen 80;
    server_name 52.74.238.107;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://52.74.238.107$request_uri; }
}

server {
    listen 443 ssl;
    server_name 52.74.238.107;
    ssl_certificate /etc/letsencrypt/live/protec-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/protec-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 70m;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
    }
    # SignalR uses only this endpoint. Keep the frontend /hubs page routed to Next.js.
    location ^~ /hubs/realtime {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass $api_upstream;
    }
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}

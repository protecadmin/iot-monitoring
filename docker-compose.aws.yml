x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    ports: !reset []
    logging: *logging
  influxdb:
    ports: !reset []
    logging: *logging
  mosquitto:
    # Plain MQTT is intentionally exposed for legacy/test devices. Production
    # devices should prefer the TLS listener on 8883.
    ports: !override ["1883:1883", "8883:8883"]
    volumes:
      - /opt/protec/shared/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - /opt/protec/shared/mosquitto/tls/fullchain.pem:/mosquitto/config/tls/fullchain.pem:ro
      - /opt/protec/shared/mosquitto/tls/privkey.pem:/mosquitto/config/tls/privkey.pem:ro
      - /opt/protec/shared/mosquitto/passwd:/mosquitto/config/passwd:ro
    logging: *logging
  api:
    image: protec-api:${RELEASE_TAG:-current}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Encryption__Key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      Firmware__PublicBaseUrl: ${PUBLIC_ORIGIN}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    ports: !override ["127.0.0.1:5000:8080"]
    logging: *logging
  ingestion:
    image: protec-ingestion:${RELEASE_TAG:-current}
    environment:
      DOTNET_ENVIRONMENT: Production
      Encryption__Key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    logging: *logging
  connectors:
    image: protec-connectors:${RELEASE_TAG:-current}
    environment:
      DOTNET_ENVIRONMENT: Production
    ports: !override ["12000:12000"]
    logging: *logging
  web:
    image: protec-web:${RELEASE_TAG:-current}
    build:
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    ports: !override ["127.0.0.1:3000:3000"]
    logging: *logging
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - /opt/protec/shared/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/protec/shared/letsencrypt:/etc/letsencrypt:ro
      - /opt/protec/shared/acme:/var/www/certbot:ro
    logging: *logging
